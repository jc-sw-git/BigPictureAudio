[package]
name = "big-picture-audio"
version = "0.1.2"
edition = "2021"
description = "Switches the default audio output device while Steam is in Big Picture mode"
license = "MIT"

[dependencies]
# Referenced directly by the `#[interface]` macro (IPolicyConfig).
windows-core = "0.61"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
